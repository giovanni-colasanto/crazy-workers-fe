workflow:
  rules:
    - if: '$GITLAB_CI == "false"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

default:
  interruptible: true
  tags:
    - test

stages:
  - lint

lint_frontend:
  stage: lint
  image: node:22
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'
  script:
    - npm ci
    - npx eslint "src/**/*.{js,vue}"
